# Daily summary and monthly statement emails.
#
# Calls the send-digest Edge Function, which decides who actually gets mail:
# only users who opted in (db/14), and only when they have new activity — a
# quiet day sends nothing.
#
# Setup (one time):
#   1. Run db/14_email_prefs.sql and db/15_digest_tracking.sql in the SQL Editor.
#   2. Deploy the send-digest Edge Function with these secrets:
#        RESEND_API_KEY, SUPABASE_SERVICE_ROLE_KEY, DIGEST_SECRET
#   3. Add these REPOSITORY secrets (Settings -> Secrets and variables -> Actions):
#        SUPABASE_URL    (already added for the keep-alive)
#        DIGEST_SECRET   (the SAME value as the Edge Function secret)
#   4. TEST WITH A DRY RUN FIRST: Actions -> this workflow -> Run workflow ->
#      kind = daily, dry_run = true. It reports what WOULD be sent and mails
#      nobody. Only switch dry_run off once that output looks right.
#
# Note: DIGEST_SECRET is what stops anyone who finds the function URL from
# triggering mass email. It is not optional.

name: Email digests

on:
  schedule:
    # Daily summary — 07:12 UTC. Odd minute because GitHub delays or drops
    # scheduled runs clustered on the hour.
    - cron: '12 7 * * *'
    # Monthly statement — 07:40 UTC on each of the first 7 days of the month,
    # covering the PREVIOUS calendar month. The function itself enforces that
    # the window ends at the start of the current month, so a late run can't
    # leak this month's data in.
    #
    # It runs on seven days but NOBODY gets seven emails: send-digest gives each
    # user one stable day in 1..DIGEST_SPREAD_DAYS (hashed from their user id)
    # and skips everyone else, so each user still gets exactly one statement a
    # month. The spread exists because email capacity is per DAY (Brevo free =
    # 300/day) — one burst on the 1st capped the whole app at ~300 users and
    # could starve the sign-in mail that shares the quota. (backlog #26)
    #
    # ⚠️ KEEP THIS RANGE AND DIGEST_SPREAD_DAYS IN STEP. This workflow cannot
    #    read the Edge Function's environment, so the two are only ever matched
    #    by hand:
    #      • raise DIGEST_SPREAD_DAYS above 7 and the users assigned to day 8+
    #        are NEVER mailed — no run happens on their day and the function
    #        can only skip them. Widen this cron to '1-N' at the same time.
    #      • lower DIGEST_SPREAD_DAYS below 7 and the extra days are harmless:
    #        the run fires, matches nobody, and reports everyone skipped.
    #    If you change one, change the other in the SAME commit — and change
    #    the matching string in the KIND check below, which must equal this
    #    cron expression exactly.
    - cron: '40 7 1-7 * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which digest to send'
        type: choice
        options: [daily, monthly]
        default: daily
      dry_run:
        description: 'Report what would be sent WITHOUT emailing anyone'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send digest
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
          # Supabase's gateway requires an Authorization header on every Edge
          # Function call, BEFORE the request reaches our code. Without it the
          # call dies at the front door with
          #   401 {"code":"UNAUTHORIZED_NO_AUTH_HEADER"}
          # which looks like our own auth check failing but is not.
          # The anon key only gets past the gateway; DIGEST_SECRET below is what
          # actually authorises the digest. Two separate layers.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # On a schedule there are no inputs, so derive the kind from WHICH
          # cron fired: the day-of-month-restricted entry is the monthly one.
          # github.event.schedule is the cron string COPIED VERBATIM from the
          # `on.schedule` block above, so the comparison below must match it
          # character for character — edit both or neither.
          EVENT_NAME:    ${{ github.event_name }}
          CRON:          ${{ github.event.schedule }}
          INPUT_KIND:    ${{ github.event.inputs.kind }}
          INPUT_DRY:     ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${DIGEST_SECRET:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL, SUPABASE_ANON_KEY or DIGEST_SECRET repository secret."
            exit 1
          fi

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            KIND="${INPUT_KIND:-daily}"
            DRY="${INPUT_DRY:-true}"
          elif [ "${CRON}" = "40 7 1-7 * *" ]; then
            KIND="monthly"; DRY="false"
          else
            KIND="daily";   DRY="false"
          fi

          echo "kind=${KIND} dryRun=${DRY}"

          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "${SUPABASE_URL}/functions/v1/send-digest" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "x-digest-secret: ${DIGEST_SECRET}" \
            -d "{\"kind\":\"${KIND}\",\"dryRun\":${DRY}}")

          echo "HTTP ${status}"
          cat response.json
          echo

          if [ "${status}" != "200" ]; then
            echo "::error::Digest call failed."
            exit 1
          fi

          # The function returns 200 with per-recipient details. Surface a
          # failed send as a red run rather than letting it hide in the body.
          if grep -q '"error"' response.json; then
            echo "::error::At least one recipient failed - see the output above."
            exit 1
          fi

          echo "Digest run complete."
