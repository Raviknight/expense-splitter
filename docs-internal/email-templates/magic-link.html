<!--
  SUPABASE EMAIL TEMPLATE — "Magic Link"
  Paste into: Supabase Dashboard → Authentication → Emails → Magic Link
  Subject line: Your Splitab sign-in code

  THE ONE RULE FOR THIS FILE: IT MUST CONTAIN NO LINKS. NOT ONE.

  Why, in full, because it looks like a downgrade and is not:

  Microsoft Defender for Office 365 ("Safe Links") — and Proofpoint, and
  Mimecast — pre-open every URL in an inbound message to scan it for malware.
  Opening a Supabase sign-in URL SPENDS the one-time token. And because Supabase
  renders the link and the code from the SAME token, spending one kills the
  other. The user then finds that neither works.

  This is not a theory. It was proven from this project's own Supabase auth log
  on 2026-09-14:
      08:43:00   /otp    200   — the user requested a code
      08:44:04   /verify 303   — token verified, Login completed
      08:45      ...           — the email actually arrived in the inbox
  The token was spent a full minute before the human could read the email.
  An earlier attempt showed the same shape (/otp 07:59:56, /verify 08:00:31).

  So: no ConfirmationURL variable, no tracking pixel, no logo hosted elsewhere,
  no "having trouble? click here" footer. A scanner cannot burn what is not
  there. If you ever add a link back to this template, the bug returns with it.

  NOTE THE VARIABLE NAMES BELOW ARE WRITTEN WITHOUT THEIR DOUBLE BRACES. That is
  deliberate. Supabase substitutes template variables ANYWHERE in the file,
  including inside an HTML comment — so writing the URL variable in full, even
  here in a note explaining not to use it, would inject a real sign-in URL into
  every email and re-create the exact bug this file exists to prevent.

  The app has accepted typed codes on the sign-in screen for a while, so nothing
  else needs to change. On iPhone this is better anyway: a link cannot open a
  home-screen web app, so tapping one lands you in Safari — signed in there, and
  still signed out in the app.

  Available variables (braces omitted on purpose, see above):
      .Token   .TokenHash   .ConfirmationURL   .SiteURL   .Email   .RedirectTo
  Only .Token is used in the markup below, deliberately.

  Styling notes: everything is inline, because email clients discard <style>
  blocks. Layout is a table — Outlook desktop renders through Word and handles
  divs badly. No border-radius on the code box for the same reason; Outlook
  ignores it and it is not worth a fallback.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FAFAF7;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background-color:#ffffff;border:1px solid #e7e5e4;padding:32px;">
        <tr>
          <td align="center" style="padding-bottom:8px;">
            <span style="font-size:20px;font-weight:700;color:#1c1917;">Splitab</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <span style="font-size:15px;color:#57534e;">Here is your sign-in code</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="background-color:#f5f5f4;border:1px solid #e7e5e4;padding:20px;">
            <span style="font-size:32px;font-weight:700;letter-spacing:8px;color:#4f46e5;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:24px;">
            <span style="font-size:14px;color:#57534e;line-height:22px;">
              Type this into the Splitab sign-in screen. It expires in 15 minutes
              and can only be used once.
            </span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:20px;border-top:1px solid #f5f5f4;">
            <span style="font-size:12px;color:#a8a29e;line-height:20px;">
              If you didn&rsquo;t ask to sign in, you can ignore this email &mdash;

            </span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
