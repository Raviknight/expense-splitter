<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Splitab</title>
    <!-- Light theme-color; a second tag below applies a dark bar when the OS is in dark mode. -->
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)" />

    <!-- No-flash theme bootstrap.
         Runs BEFORE the body renders so the page paints in the right theme on
         the very first frame (no white flash before the app loads).
         Rule: use the saved choice if there is one; otherwise follow the OS. -->
    <script>
      (function(){try{var t=localStorage.getItem('slitab.theme');var d=t==='dark'||(t===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark');}catch(e){}})();
    </script>

    <!-- PWA manifest (relative path works under any GitHub Pages subpath) -->
    <link rel="manifest" href="manifest.json" />

    <!-- Apple / iOS home screen support -->
    <!-- Both, deliberately. `mobile-web-app-capable` is the standard Chrome now
         warns about missing; `apple-mobile-web-app-capable` is the older Apple
         spelling that iOS still reads, and dropping it would break the
         standalone home-screen behaviour this app relies on. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Splitab" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <!-- Browsers request /favicon.ico from the site root whether or not one is
         declared, so without this every page load logged a 404. Harmless in
         itself, but a console with routine noise in it is a console nobody
         reads carefully — and this session was solved by spotting one real
         message among the noise. Points at an icon that already exists rather
         than adding another asset. -->
    <link rel="icon" href="icons/icon-192.png" type="image/png" />

    <!-- Tailwind, compiled at build time to a static stylesheet.
         Previously this was the Play CDN (cdn.tailwindcss.com), which shipped
         ~400KB of JavaScript and then compiled the CSS in the browser on every
         page load by scanning the DOM - render-blocking, and explicitly warned
         against for production. Source: src/styles.css, config: tailwind.config.js -->
    <link rel="stylesheet" href="styles.css" />
    <!-- Custom CSS (iOS 16px inputs, dark-mode overrides) moved to src/styles.css -->

    <!-- Cloudflare Turnstile — the CAPTCHA on the sign-in screen.
         It proves "a real person is doing this" without asking anyone to pick
         traffic lights, and Supabase Auth can be told to require the token it
         produces (Authentication -> Attack Protection -> CAPTCHA protection).

         The SITEKEY is PUBLIC by design. It identifies the widget to
         Cloudflare and is meant to be visible in the page source, exactly like
         the Supabase anon key. The matching SECRET key lives only in Supabase
         and is never in this repo. It lives in src/auth/AuthScreen.jsx as
         TURNSTILE_SITEKEY.

         async + defer so a slow or blocked Cloudflare CDN can never hold up
         the page paint. AuthScreen renders the widget EXPLICITLY
         (window.turnstile.render) rather than relying on this script
         auto-scanning the page for a ".cf-turnstile" element, so React stays in
         control of when the widget is created and destroyed. If this script
         never arrives, AuthScreen signs people in with no token instead of
         blocking them. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <!-- Service worker registration.
         'sw.js' is a relative path so the SW scope matches the GitHub Pages
         subpath (/expense-splitter/) rather than locking to the root (/). -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').then(function (reg) {
            console.log('[SW] Registered, scope:', reg.scope);
          }).catch(function (err) {
            console.error('[SW] Registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="bundle-OIVC7RKT.js"></script>
  </body>
</html>
